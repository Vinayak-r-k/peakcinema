<script>
const API_KEY = "740f2cfce22e7d55b58d28212e9f6ecc";

const movieRow = document.getElementById("movie-row");
const tvRow = document.getElementById("tv-row");

function year(d) {
    return d ? d.substring(0, 4) : "Unknown";
}
function openAtlantic(title) {
    const url = title? "https://atlantic.st/search?q=" +encodeURIComponent(title).replace(/%20/g, "+").replace(/%3A/gi, ":"): "https://atlantic.st/history";

    try {
        const appControl = new tizen.ApplicationControl(
            "http://tizen.org/appcontrol/operation/view", url);
        tizen.application.launchAppControl(appControl, null,
            function () {},
            function () { window.location.href = url; }
        ); 
    } catch (e) {
        window.location.href = url;
    }
}

const atlanticBtn = document.getElementById("atlantic-btn");
atlanticBtn.addEventListener("click", function () {
    openAtlantic();
});


// fetch with timeout + automatic retries
function fetchJSON(url, tries) {
    tries = tries || 5;
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 8000);

    return fetch(url, { signal: controller.signal })
        .then(r => {
            clearTimeout(timer);
            if (!r.ok) throw new Error("HTTP " + r.status);
            return r.json();
        })
        .catch(err => {
            clearTimeout(timer);
            if (tries <= 1) throw err;
            // wait a bit longer after each failure: 1s, 2s, 3s...
            const wait = (6 - tries) * 1000;
            return new Promise(res => setTimeout(res, wait))
                .then(() => fetchJSON(url, tries - 1));
        });
}

function renderRow(rowEl, baseUrl, buildCard, pages) {
    pages = pages || 50;   // 3 pages = up to 60 items
    rowEl.innerHTML = '<p style="color:white;padding:20px">Loading...</p>';

    const requests = [];
    for (let p = 1; p <= pages; p++) {
        requests.push(
            fetchJSON(baseUrl + "&page=" + p).catch(() => ({ results: [] }))
        );
    }

    return Promise.all(requests).then(all => {
        const seen = {};
        const items = Array.prototype.concat
            .apply([], all.map(d => d.results || []))
            .filter(item => {
                if (!item.poster_path || seen[item.id]) return false;
                seen[item.id] = true;   // remove duplicates
                return true;
            });

        if (!items.length) throw new Error("empty");
        rowEl.innerHTML = items.map(buildCard).join("");
    }).catch(() => {
        rowEl.innerHTML =
            '<p style="color:white;padding:20px">Could not load. Check your internet connection.</p>';
    });
}

function movieCard(movie) {
    return `
        <div class="movie" tabindex="0">
            <div class="trending-card">
                <img src="https://image.tmdb.org/t/p/w500${movie.poster_path}" height="150" width="250">
            </div>
            <div class="trending-now-title"><h6>${movie.title}</h6></div>
            <div class="trending-now-date"><h6>${year(movie.release_date)}</h6></div>
        </div>`;
}

function tvCard(tv) {
    return `
        <div class="tv" tabindex="0">
            <div class="monthly-hits-card">
                <img src="https://image.tmdb.org/t/p/w500${tv.poster_path}" height="150" width="250">
            </div>
            <div class="monthly-hits-title"><h6>${tv.original_name}</h6></div>
            <div class="monthly-hits-date"><h6>${year(tv.first_air_date)}</h6></div>
        </div>`;
    }

function loadAll() {
    return Promise.all([
        renderRow(movieRow, `https://api.themoviedb.org/3/trending/movie/day?api_key=${API_KEY}`, movieCard),
        renderRow(tvRow, `https://api.themoviedb.org/3/tv/popular?api_key=${API_KEY}`, tvCard)
    ]).then(() => {
        const first = document.querySelector(".movie, .tv");
        if (first) first.focus();
    });
}

loadAll();

// if the TV connects to the internet after the app opened, reload the rows
window.addEventListener("online", function () {
    if (!document.querySelector(".movie, .tv")) loadAll();
});

// Remote control key codes (event.key is unreliable on older Tizen)
const KEY = { LEFT: 37, UP: 38, RIGHT: 39, DOWN: 40, ENTER: 13, BACK: 10009 };

document.addEventListener("keydown", function (event) {
    const code = event.keyCode;
    const active = document.activeElement;

    // Back key: exit the app
    if (code === KEY.BACK) {
        try { tizen.application.getCurrentApplication().exit(); } catch (e) {}
        return;
    }

    // ---------- Atlantic button ----------
    if (active === atlanticBtn) {
        if (code === KEY.DOWN) {
            const first = movieRow.querySelector(".movie");
            if (first) { event.preventDefault(); first.focus(); }
        }
        return;   // Enter is handled by the click listener
    }

    // ---------- Cards ----------
    const rows = [movieRow, tvRow];
    const card = active && active.closest ? active.closest(".movie, .tv") : null;

    // nothing focused yet: any arrow key focuses the first card
    if (!card) {
        if ([KEY.LEFT, KEY.UP, KEY.RIGHT, KEY.DOWN].includes(code)) {
            const first = document.querySelector(".movie, .tv");
            if (first) { event.preventDefault(); first.focus(); }
        }
        return;
    }

    const row = card.parentElement;
    const rowIndex = rows.indexOf(row);
    const cards = Array.from(row.children);
    const index = cards.indexOf(card);
    let target = null;

    switch (code) {
        case KEY.RIGHT:
            target = cards[index + 1];
            break;
        case KEY.LEFT:
            target = cards[index - 1];
            break;
        case KEY.DOWN: {
            const nextRow = rows[rowIndex + 1];
            if (nextRow && nextRow.children.length) {
                target = nextRow.children[Math.min(index, nextRow.children.length - 1)];
            }
            break;
        }
        case KEY.UP: {
            const prevRow = rows[rowIndex - 1];
            if (prevRow && prevRow.children.length) {
                target = prevRow.children[Math.min(index, prevRow.children.length - 1)];
            } else {
                target = atlanticBtn;   // top row: go up to the Atlantic button
                window.scrollTo(0, 0);
            }
            break;
        }
        case KEY.ENTER:
            event.preventDefault();
            openAtlantic(card.querySelector("h6").textContent.trim());
            return;
        default:
            return;
    }

    if (target) {
        event.preventDefault();
        target.focus();
        if (target !== atlanticBtn) {
            target.scrollIntoView({ block: "nearest", inline: "center" });
        }
    }
});
</script>
